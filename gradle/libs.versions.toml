[versions]
# Shared modules + 1.21.1 drivers compile to Java 21 bytecode (§5.0 floor);
# 26.x drivers use Java 25 (26.1+ requires it, §5.10).
jdk-shared = "21"
jdk-26x = "25"

# 1.21.1 cell (stage B). Sources (checked 2026-09-23):
#   neoforge1211 — https://maven.neoforged.net/api/maven/versions/releases/net/neoforged/neoforge (latest 21.1.x)
#   parchment1211 — https://maven.parchmentmc.org/org/parchmentmc/data/parchment-1.21.1/maven-metadata.xml (latest release)
#   yarn1211 / fabricLoader / fabricApi1211 — https://maven.fabricmc.net metadata (latest for 1.21.1).
mc1211 = "1.21.1"
neoforge1211 = "21.1.251"
parchment1211 = "2024.11.17"
yarn1211 = "1.21.1+build.3"
fabricLoader = "0.19.5"
fabricApi1211 = "0.116.17+1.21.1"

# 26.x cell (stage C). The game ships unobfuscated: no Yarn/intermediary and no
# Parchment (mappings-less). neoforge26x targets mc26Latest; a NeoForge build
# (26.3.0.10-beta) and Fabric API 0.161.0+26.3 exist for 26.3, so the window
# holds (sub-00 §4). Sources: same maven endpoints as above.
neoforge26x = "26.3.0.10-beta"
fabricApi26x = "0.161.0+26.3"
# loader/toolchain versions here — a drop bump is a two-line edit (sub-00 §4).
mc26Latest = "26.3"
mc26Previous = "26.2"

[libraries]
# DFU carve-out (§5.1): the one external type allowed in vine-api signatures.
# Published only to Mojang's maven (declared in vine.java-shared).
datafixerupper = { group = "com.mojang", name = "datafixerupper", version = "8.0.16" }

# TCK scenario JSON parsing (tck-core only; never on consumer classpaths).
gson = { group = "com.google.code.gson", name = "gson", version = "2.11.0" }

# Driver cells resolve loader/game artifacts directly by catalog version in
# their build files (loom/MDG configurations are not plain `implementation`
# deps in the 1.21.1 cell), so no driver library aliases are needed.

[plugins]
# Toolchain plugins, applied ONLY inside their own driver subproject (sub-00 §4).
# Sources (checked 2026-09-23):
#   moddevgradle — https://plugins.gradle.org/m2/net/neoforged/moddev/ marker metadata (release 2.0.147)
#   fabric-loom* — https://maven.fabricmc.net plugin markers (1.17.21, Fabric's
#   recommendation for 26.3: https://www.fabricmc.net/2026/09/15/263.html).
#   1.21.11 and older use the remapping loom; 26.1+ uses the non-remapping loom
#   (https://www.fabricmc.net/2026/03/14/261.html).
moddevgradle = { id = "net.neoforged.moddev", version = "2.0.147" }
fabricLoomRemap = { id = "net.fabricmc.fabric-loom-remap", version = "1.17.21" }
fabricLoom = { id = "net.fabricmc.fabric-loom", version = "1.17.21" }
