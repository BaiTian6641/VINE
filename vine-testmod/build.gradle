plugins {
    id 'vine.java-shared'
}

// sub-22 Stage A: the Prime Invariant's testmod-side enforcement — classpath
// isolation + forbidden-pattern grep + no per-cell source duplication.
// `check` (hence CI's :vine-testmod:build) runs it.
apply from: 'purity-gate.gradle'

dependencies {
    // Consumer-style mod (sub-22): compiles against the API ONLY — this
    // dependency edge is the Prime Invariant's build-level enforcement.
    api project(':vine-api')
    api project(':vine-client-api')
}

// Per-cell jars compile the same sources; the gate covers their classpaths and
// duplication from their own projects (each cell applies purity-gate.gradle).

// The engine cooks a partner mod's weapon preset; the pack that owns the item ships it.
// A real pack runs its own datagen (the cells' `datagenContent` is the wiring to copy) —
// this testmod is the exemplar consumer, so it ships the file both cells' datagen emit,
// byte-identical (sha256 c55cb4e5…), rather than a hand-written copy that could drift.
// Without this the preset exists only under build/datagen and no running game ever sees it.
processResources {
    from(rootProject.file('vine-tck/fixtures/datagen/1.21.1-fabric/data/vine_test/weapon_attributes')) {
        include 'partner_blade.json'
        into 'data/vine_test/weapon_attributes'
    }
}
