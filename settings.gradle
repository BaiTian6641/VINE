pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    // Auto-provision JDK toolchains (21 for shared/1.21.1, 25 for 26.x drivers).
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.10.0'
}

rootProject.name = 'vine'

// Shared modules — consumers compile against vine-api (+ vine-client-api) ONLY.
// Prime Invariant: no net.minecraft/loader types in their signatures (§5.1).
include 'vine-api'
include 'vine-client-api'
include 'vine-core'
include 'vine-spi'
include 'vine-tck'
include 'vine-testmod'

// Driver subprojects land in drivers/ at sub-00 stages B/C; their toolchain
// plugins (ModDevGradle / fabric-loom) apply only inside their own subproject,
// never at root (loom + MDG must never share a classpath, sub-00 §4).

includeBuild 'build-logic'
