pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        // Loom plugin markers live on Fabric's maven, not the plugin portal.
        maven { url = 'https://maven.fabricmc.net/' }
    }
}
plugins {
    // Auto-provision JDK toolchains (21 for shared/1.21.1, 25 for 26.x drivers).
    // 1.0.0: 0.10.0 references JvmVendorSpec.IBM_SEMERU, removed in Gradle 9.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}


rootProject.name = 'vine'

// Shared modules — consumers compile against vine-api (+ vine-client-api) ONLY.
// Prime Invariant: no net.minecraft/loader types in their signatures (§5.1).
include 'vine-api'
include 'vine-client-api'
include 'vine-core'
include 'vine-spi'
include 'vine-tck'
include 'vine-testmod'

// Driver subprojects (sub-00 stages B/C): one per cell. Their toolchain plugins
// (ModDevGradle / fabric-loom) apply only inside their own subproject, never at
// root; loom and MDG never share a project classpath (sub-00 §4).
include 'drivers:driver-1.21.1-neoforge'
include 'drivers:driver-1.21.1-fabric'
include 'drivers:driver-26.x-neoforge'
include 'drivers:driver-26.x-fabric'

includeBuild 'build-logic'
