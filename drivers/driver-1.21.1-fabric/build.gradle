plugins {
    // Toolchain plugin applied ONLY inside this subproject (sub-00 §4). 1.21.1
    // is obfuscated, so this is the remapping loom (Yarn + intermediary).
    alias(libs.plugins.fabricLoomRemap)
    id 'vine.driver-1.21.1-fabric'
}


// Shared loader-neutral 1.21.1 mechanics compile INTO this jar (sub-18 §2) —
// same sources as the NeoForge cell, never a published artifact.
sourceSets.main.java.srcDir '../driver-1.21.1-common/src/main/java'

repositories {
    // GeckoLib releases live on Cloudsmith, not Maven Central.
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}
dependencies {
    minecraft "com.mojang:minecraft:${libs.versions.mc1211.get()}"
    mappings "net.fabricmc:yarn:${libs.versions.yarn1211.get()}:v2"
    modImplementation "net.fabricmc:fabric-loader:${libs.versions.fabricLoader.get()}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${libs.versions.fabricApi1211.get()}"
    // GeckoLib GL4 render backend — hard dep per §5.14 (declared in fabric.mod.json).
    modImplementation 'software.bernie.geckolib:geckolib-fabric-1.21.1:4.9.3'
    // sub-02 Stage B: the consumer-style testmod rides the dev-run classpath as
    // a plain library (no fabric.mod.json) for VineInitializer discovery.
    runtimeOnly project(':vine-testmod')
}

loom {
    runs {
        server {
            server()
            programArgs '--nogui'
        }
    }
}
