plugins {
    // Toolchain plugin applied ONLY inside this subproject (sub-00 §4). 1.21.1
    // is obfuscated, so this is the remapping loom (Yarn + intermediary).
    alias(libs.plugins.fabricLoomRemap)
    id 'vine.driver-1.21.1-fabric'
}


// Shared loader-neutral 1.21.1 mechanics compile INTO this jar (sub-18 §2) —
// same sources as the NeoForge cell, never a published artifact.
sourceSets.main.java.srcDir '../driver-1.21.1-common/src/main/java'

repositories {
    // GeckoLib releases live on Cloudsmith, not Maven Central.
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}
dependencies {
    minecraft "com.mojang:minecraft:${libs.versions.mc1211.get()}"
    mappings "net.fabricmc:yarn:${libs.versions.yarn1211.get()}:v2"
    modImplementation "net.fabricmc:fabric-loader:${libs.versions.fabricLoader.get()}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${libs.versions.fabricApi1211.get()}"
    // GeckoLib GL4 render backend — hard dep per §5.14 (declared in fabric.mod.json).
    modImplementation 'software.bernie.geckolib:geckolib-fabric-1.21.1:4.9.3'
    // sub-02 Stage B: the consumer-style testmod rides the dev-run classpath as
    // a plain library (no fabric.mod.json) for VineInitializer discovery.
    runtimeOnly project(':vine-testmod')
}

loom {
    runs {
        server {
            server()
            programArgs '--nogui'
        }
        // The TCK's GameTest path (sub-21 Stage B): the loader's own test lifecycle
        // around the same in-process scenarios the /vine_test tck_run command runs.
        gametest {
            server()
            name = 'Gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.file('gametest.xml').get().asFile}"
            runDir 'run/gametest'
        }
    }
}

// The dev server reads console commands from stdin — the TCK harness drives
// scenarios (and its graceful stop) through it. JavaExec gets an empty stdin
// unless it asks, so the pipe would otherwise never reach the server.
tasks.named('runServer') {
    standardInput = System.in
    // TCK loopback passthrough (sub-21 Stage B): set by the scenario runner's
    // child invocation so packet echo runs headless without a client.
    if (providers.gradleProperty('vine.tck.loopback').map { it.toBoolean() }.getOrElse(false)) {
        jvmArgs '-Dvine.tck.loopback=true'
    }
}


// ---------------------------------------------------------------------------
// sub-02 Stage E — driver-owned content cooking: consumer source assets ->
// per-cell derived resources (blockstates, models, sounds.json). Deterministic;
// the TCK's verifyDatagen task byte-compares the result against golden fixtures.
// ---------------------------------------------------------------------------
tasks.register('datagenContent', JavaExec) {
    group = 'vine'
    description = 'Cooks consumer source assets into this cell\'s derived resources (sub-02 Stage E).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.vineengine.vine.internal.driver1211.common.datagen.ContentCooker'
    def outDir = layout.buildDirectory.dir('datagen/1.21.1-fabric').get().asFile
    args = [
            '--cell', '1.21.1-fabric',
            '--assets', project(':vine-testmod').file('src/main/resources/assets').absolutePath,
            '--out', outDir.absolutePath,
    ]
    outputs.dir(outDir)
}
