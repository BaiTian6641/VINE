plugins {
    // Toolchain plugin applied ONLY inside this subproject (sub-00 §4). 1.21.1
    // is obfuscated, so this is the remapping loom (Yarn + intermediary).
    alias(libs.plugins.fabricLoomRemap)
    id 'vine.driver-1.21.1-fabric'
}


// Shared loader-neutral 1.21.1 mechanics compile INTO this jar (sub-18 §2) —
// same sources as the NeoForge cell, never a published artifact.
sourceSets.main.java.srcDir '../driver-1.21.1-common/src/main/java'

repositories {
    // GeckoLib releases live on Cloudsmith, not Maven Central.
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}
dependencies {
    minecraft "com.mojang:minecraft:${libs.versions.mc1211.get()}"
    mappings "net.fabricmc:yarn:${libs.versions.yarn1211.get()}:v2"
    modImplementation "net.fabricmc:fabric-loader:${libs.versions.fabricLoader.get()}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${libs.versions.fabricApi1211.get()}"
    // GeckoLib GL4 render backend — hard dep per §5.14 (declared in fabric.mod.json).
    modImplementation 'software.bernie.geckolib:geckolib-fabric-1.21.1:4.9.3'
    // sub-02 Stage B: the consumer-style testmod rides the dev-run classpath as
    // a plain library (no fabric.mod.json) for VineInitializer discovery.
    runtimeOnly project(':vine-testmod')
}

// ---------------------------------------------------------------------------
// Content cooking (sub-02 Stage E + sub-10 §2 partner presets): the cooking JVM is
// a plain JVM with no game, so it binds a driver that needs no loader. That inert
// driver — and the cooking entry point — live in a source set of their own: they
// never enter the mod jar, and the game keeps binding exactly one driver (two
// VineDriver services on one classpath is an engine boot failure).
// ---------------------------------------------------------------------------
sourceSets {
    datagen {
        java.srcDir 'src/datagen/java'
        // No resources.srcDir: src/datagen/resources is already the default, and declaring it
        // makes Gradle see the same service file twice and fail the copy.
        // Compiled against everything the driver compiles against: the entry reuses the
        // engine's own cooking class and the common content cooker — never a copy.
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
    }
}

loom {
    runs {
        server {
            server()
            programArgs '--nogui'
            // TCK ephemeral port (sub-21 Stage E): the scenario runner passes
            // -Pvine.tck.port so a sweep never fights another dev server for 25565.
            // Absent property => the vanilla default, so a human's dev server is
            // unchanged.
            String tckPort = providers.gradleProperty('vine.tck.port').getOrNull()
            if (tckPort != null) {
                programArgs '--port', tckPort
            }
        }
        // The TCK's GameTest path (sub-21 Stage B): the loader's own test lifecycle
        // around the same in-process scenarios the /vine_test tck_run command runs.
        gametest {
            server()
            name = 'Gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.file('gametest.xml').get().asFile}"
            runDir 'run/gametest'
        }
        // Scripted client run (sub-21's client half): a real dev client boots, creates a
        // single-player world with cheats, drives the ClientScript the harness names,
        // writes its screenshots into run/screenshots and quits. The system property is
        // set only when -Pvine.tck.clientScript is passed, so invoking this run config
        // (or runTckClient) without the property is an ordinary dev client that never
        // auto-quits — the same entry point, no second code path.
        tckClient {
            client()
            runDir 'run'
            String script = providers.gradleProperty('vine.tck.clientScript').getOrNull()
            if (script != null) {
                vmArg "-Dvine.tck.clientScript=${script}"
            }
        }
    }
}

// The dev server reads console commands from stdin — the TCK harness drives
// scenarios (and its graceful stop) through it. JavaExec gets an empty stdin
// unless it asks, so the pipe would otherwise never reach the server.
tasks.named('runServer') {
    standardInput = System.in
    // TCK loopback passthrough (sub-21 Stage B): set by the scenario runner's
    // child invocation so packet echo runs headless without a client.
    if (providers.gradleProperty('vine.tck.loopback').map { it.toBoolean() }.getOrElse(false)) {
        jvmArgs '-Dvine.tck.loopback=true'
    }
}


// ---------------------------------------------------------------------------
// sub-18 Stage E — the stage's headless GameTest boot path. Loom derives run
// task names from the run-config key ('gametest' -> runGametest), and the key
// keeps that name because sub-21's docs reference runGametest; this alias is the
// boot path under the name the Stage E acceptance invokes, and it drives the
// same run configuration (same args, same run/gametest dir).
// ---------------------------------------------------------------------------
tasks.register('runGameTestServer') {
    group = 'vine'
    description = 'Alias of runGametest (headless GameTest boot, sub-18 Stage E).'
    dependsOn 'runGametest'
}

// ---------------------------------------------------------------------------
// sub-21's client half — the scripted client run the TCK harness invokes:
//
//   gradlew :drivers:driver-1.21.1-fabric:vineTckClient \
//       -Pvine.tck.clientScript=<absolute path to a ClientScript JSON>
//
// The run dir's screenshots folder is cleared by its own Delete task, ordered before the
// client starts: a stale PNG from an earlier run can then never be mistaken for this run's
// output. A task (not a doFirst action) because this build stores the configuration cache,
// and a task's inputs are resolved at configuration time. The task is deliberately not
// wired into `check` — it opens a window and drives a real client.
def clearTckScreenshots = tasks.register('clearVineTckClientScreenshots', Delete) {
    group = 'vine'
    description = 'Clears this cell\'s run/screenshots before a scripted client run.'
    delete layout.projectDirectory.dir('run/screenshots')
}

tasks.named('runTckClient') {
    dependsOn clearTckScreenshots
    mustRunAfter clearTckScreenshots
}

tasks.register('vineTckClient') {
    group = 'vine'
    description = 'Dev client that runs -Pvine.tck.clientScript (a ClientScript JSON) and exits.'
    dependsOn 'runTckClient'
}

// ---------------------------------------------------------------------------
// sub-02 Stage E + sub-10 §2 — driver-owned content cooking: consumer source assets
// -> per-cell derived resources (blockstates, models, sounds.json) *and* the combat
// partner's own weapon preset for every registered partner-owned weapon. Deterministic
// (the preset bytes are the engine's); the TCK's verifyDatagen task byte-compares the
// whole cooked tree against golden fixtures.
// ---------------------------------------------------------------------------
tasks.register('datagenContent', JavaExec) {
    group = 'vine'
    description = 'Cooks consumer source assets and combat partner presets into this cell\'s derived resources (sub-02 Stage E, sub-10).'
    // Everything the driver compiles against, deliberately WITHOUT this module's
    // resources dir: the loader driver's service entry lives there, and the cooking JVM
    // must bind the datagen driver only. The consumer's own output is on the classpath
    // because presets are cooked from what that consumer registered in the engine, not
    // from a second reading of its sources.
    classpath = files(
            sourceSets.datagen.output,
            sourceSets.main.output.classesDirs,
            configurations.runtimeClasspath,
            project(':vine-testmod').sourceSets.main.output)
    // The cell's own entry point (sub-10 Stage D): it delegates the asset cooking to the
    // shared ContentCooker and then cooks the partner presets, which are read from the
    // descriptors consumers registered — that pass needs the engine, so it is per cell.
    mainClass = 'dev.vineengine.vine.internal.driver1211.fabric.datagen.FabricContentCooker'
    def outDir = layout.buildDirectory.dir('datagen/1.21.1-fabric').get().asFile
    args = [
            '--cell', '1.21.1-fabric',
            '--assets', project(':vine-testmod').file('src/main/resources/assets').absolutePath,
            '--out', outDir.absolutePath,
    ]
    outputs.dir(outDir)
}
