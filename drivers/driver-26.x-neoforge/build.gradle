plugins {
    // Toolchain plugin applied ONLY inside this subproject (sub-00 §4). 26.x
    // ships unobfuscated: no parchment block, no mappings step.
    alias(libs.plugins.moddevgradle)
    id 'vine.driver-26.x-neoforge'
}

neoForge {
    // Drop-window version from the catalog (mc26Latest, sub-00 §3).
    version = libs.versions.neoforge26x.get()

    runs {
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        vine {
            sourceSet sourceSets.main
        }
    }
}
