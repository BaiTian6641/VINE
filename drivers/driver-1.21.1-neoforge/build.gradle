plugins {
    // Toolchain plugin applied ONLY inside this subproject (sub-00 §4); shared
    // java/dependency wiring lives in the per-cell convention below.
    alias(libs.plugins.moddevgradle)
    id 'vine.driver-1.21.1-neoforge'
}


// Shared loader-neutral 1.21.1 mechanics compile INTO this jar (sub-18 §2) —
// same sources as the Fabric cell, never a published artifact.
sourceSets.main.java.srcDir '../driver-1.21.1-common/src/main/java'

repositories {
    // GeckoLib releases live on Cloudsmith, not Maven Central.
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

dependencies {
    // GeckoLib GL4 render backend — hard dep per §5.14 (declared in mods.toml).
    implementation 'software.bernie.geckolib:geckolib-neoforge-1.21.1:4.9.3'
}
neoForge {
    version = libs.versions.neoforge1211.get()

    // Mojmap + Parchment parameter names/javadoc (1.21.1 is still obfuscated,
    // unlike the 26.x cells).
    parchment {
        minecraftVersion = libs.versions.mc1211.get()
        mappingsVersion = libs.versions.parchment1211.get()
    }

    runs {
        server {
            server()
            programArgument '--nogui'
            dependencies {
                // MDG dev runs exclude ordinary library deps from the runtime
                // classpath; the engine modules must be present when the driver
                // boots (sub-00 Stage D, per-run RunModel config).
                additionalRuntimeClasspath project(':vine-api')
                additionalRuntimeClasspath project(':vine-core')
                additionalRuntimeClasspath project(':vine-spi')
                // sub-02 Stage B: the consumer-style testmod must be on the
                // classpath for VineInitializer discovery (not a loader mod).
                additionalRuntimeClasspath project(':vine-testmod')
            }
        }
    }

    mods {
        vine {
            sourceSet sourceSets.main
        }
    }
}

// The dev server reads console commands from stdin — the TCK harness drives
// scenarios (and its graceful stop) through it. JavaExec gets an empty stdin
// unless it asks, so the pipe would otherwise never reach the server.
tasks.named('runServer') {
    standardInput = System.in
    // TCK loopback passthrough (sub-21 Stage B): set by the scenario runner's
    // child invocation so packet echo runs headless without a client.
    if (providers.gradleProperty('vine.tck.loopback').map { it.toBoolean() }.getOrElse(false)) {
        jvmArgs '-Dvine.tck.loopback=true'
    }
}


// ---------------------------------------------------------------------------
// sub-02 Stage E — driver-owned content cooking: consumer source assets ->
// per-cell derived resources (blockstates, models, sounds.json). Deterministic;
// the TCK's verifyDatagen task byte-compares the result against golden fixtures.
// ---------------------------------------------------------------------------
tasks.register('datagenContent', JavaExec) {
    group = 'vine'
    description = 'Cooks consumer source assets into this cell\'s derived resources (sub-02 Stage E).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.vineengine.vine.internal.driver1211.common.datagen.ContentCooker'
    def outDir = layout.buildDirectory.dir('datagen/1.21.1-neoforge').get().asFile
    args = [
            '--cell', '1.21.1-neoforge',
            '--assets', project(':vine-testmod').file('src/main/resources/assets').absolutePath,
            '--out', outDir.absolutePath,
    ]
    outputs.dir(outDir)
}
