plugins {
    // Toolchain plugin applied ONLY inside this subproject (sub-00 §4); shared
    // java/dependency wiring lives in the per-cell convention below.
    alias(libs.plugins.moddevgradle)
    id 'vine.driver-1.21.1-neoforge'
}


// Shared loader-neutral 1.21.1 mechanics compile INTO this jar (sub-18 §2) —
// same sources as the Fabric cell, never a published artifact.
sourceSets.main.java.srcDir '../driver-1.21.1-common/src/main/java'

repositories {
    // GeckoLib releases live on Cloudsmith, not Maven Central.
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

dependencies {
    // GeckoLib GL4 render backend — hard dep per §5.14 (declared in mods.toml).
    implementation 'software.bernie.geckolib:geckolib-neoforge-1.21.1:4.9.3'
}

// ---------------------------------------------------------------------------
// Content cooking (sub-02 Stage E + sub-10 §2 partner presets): the cooking JVM is
// a plain JVM with no game, so it binds a driver that needs no mod event bus. That
// inert driver — and the cooking entry point — live in a source set of their own:
// they never enter the mod jar, and the game keeps binding exactly one driver (two
// VineDriver services on one classpath is an engine boot failure).
// ---------------------------------------------------------------------------
sourceSets {
    datagen {
        java.srcDir 'src/datagen/java'
        // No resources.srcDir: src/datagen/resources is already the default, and declaring it
        // makes Gradle see the same service file twice and fail the copy.
        // Compiled against everything the driver compiles against: the entry reuses the
        // engine's own cooking class and the common content cooker — never a copy.
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
    }
}

neoForge {
    version = libs.versions.neoforge1211.get()

    // Mojmap + Parchment parameter names/javadoc (1.21.1 is still obfuscated,
    // unlike the 26.x cells).
    parchment {
        minecraftVersion = libs.versions.mc1211.get()
        mappingsVersion = libs.versions.parchment1211.get()
    }

    runs {
        // The scripted client run (sub-21 Stage F): a real dev client driven by a JSON step
        // script. `-Pvine.tck.clientScript=<path>` is the only thing that arms it — with the
        // property absent this is a plain dev client, exactly as before.
        client {
            client()
            String tckClientScript = providers.gradleProperty('vine.tck.clientScript').getOrNull()
            if (tckClientScript != null) {
                systemProperty 'vine.tck.clientScript', tckClientScript
            }
            dependencies {
                // Same reason as the server run: MDG dev runs exclude ordinary library deps
                // from the runtime classpath, and the engine modules plus the testmod's
                // commands must be present for the script to drive anything.
                additionalRuntimeClasspath project(':vine-api')
                additionalRuntimeClasspath project(':vine-core')
                additionalRuntimeClasspath project(':vine-spi')
                additionalRuntimeClasspath project(':vine-testmod')
            }
        }
        // The TCK's GameTest path (sub-21 Stage B): the loader's own test lifecycle
        // around the same in-process scenarios the /vine_test tck_run command runs.
        // The empty structure it needs ships as a real 1.21 structure NBT at
        // data/vine/structure/empty.nbt (NeoForge resolves templates from
        // datapacks; vanilla's gametest one is not present in dev runs).
        gameTestServer {
            type = 'gameTestServer'
            dependencies {
                additionalRuntimeClasspath project(':vine-api')
                additionalRuntimeClasspath project(':vine-core')
                additionalRuntimeClasspath project(':vine-spi')
                additionalRuntimeClasspath project(':vine-testmod')
            }
        }
        server {
            server()
            programArgument '--nogui'
            // TCK ephemeral port (sub-21 Stage E): see the Fabric driver's note —
            // a sweep gets its own port, a human's dev server keeps 25565.
            String tckPort = providers.gradleProperty('vine.tck.port').getOrNull()
            if (tckPort != null) {
                programArgument '--port'
                programArgument tckPort
            }
            dependencies {
                // MDG dev runs exclude ordinary library deps from the runtime
                // classpath; the engine modules must be present when the driver
                // boots (sub-00 Stage D, per-run RunModel config).
                additionalRuntimeClasspath project(':vine-api')
                additionalRuntimeClasspath project(':vine-core')
                additionalRuntimeClasspath project(':vine-spi')
                // sub-02 Stage B: the consumer-style testmod must be on the
                // classpath for VineInitializer discovery (not a loader mod).
                additionalRuntimeClasspath project(':vine-testmod')
            }
        }
    }

    mods {
        vine {
            sourceSet sourceSets.main
        }
    }
}

// The dev server reads console commands from stdin — the TCK harness drives
// scenarios (and its graceful stop) through it. JavaExec gets an empty stdin
// unless it asks, so the pipe would otherwise never reach the server.
tasks.named('runServer') {
    standardInput = System.in
    // TCK loopback passthrough (sub-21 Stage B): set by the scenario runner's
    // child invocation so packet echo runs headless without a client.
    if (providers.gradleProperty('vine.tck.loopback').map { it.toBoolean() }.getOrElse(false)) {
        jvmArgs '-Dvine.tck.loopback=true'
    }
}


// ---------------------------------------------------------------------------
// sub-21 Stage F — the scripted client run. Kept out of `check`: it needs a GPU,
// a window and a JSON script, and it is an acceptance path a human (or the TCK)
// invokes by name, like the boot smokes. The client run reads the script path at
// configuration time (see the `client` run above); this alias validates the input,
// clears the previous screenshots, then drives that run.
// ---------------------------------------------------------------------------
def clientScriptProperty = providers.gradleProperty('vine.tck.clientScript')

def validateClientScript = tasks.register('validateClientScript') {
    description = 'Checks that -Pvine.tck.clientScript names an existing JSON ClientScript.'
    doLast {
        String path = clientScriptProperty.getOrNull()
        if (path == null) {
            throw new GradleException(
                    'vineTckClient needs -Pvine.tck.clientScript=<absolute path to a JSON ClientScript>')
        }
        if (!new File(path).isFile()) {
            throw new GradleException("vine.tck.clientScript is not a file: ${path}")
        }
    }
}

def clearClientScreenshots = tasks.register('clearClientScreenshots', Delete) {
    description = 'Clears the run dir\'s screenshots folder so a run cannot pass on a stale image.'
    delete layout.projectDirectory.dir('run/screenshots')
}

clearClientScreenshots.configure { mustRunAfter validateClientScript }
tasks.named('runClient') { mustRunAfter clearClientScreenshots }

tasks.register('vineTckClient') {
    group = 'vine'
    description = 'Runs the 1.21.1-neoforge dev client against a JSON ClientScript (-Pvine.tck.clientScript=<path>) and exits with the client\'s own code.'
    dependsOn validateClientScript
    dependsOn clearClientScreenshots
    dependsOn 'runClient'
}


// ---------------------------------------------------------------------------
// sub-02 Stage E + sub-10 §2 — driver-owned content cooking: consumer source assets
// -> per-cell derived resources (blockstates, models, sounds.json) *and* the combat
// partner's own weapon preset for every registered partner-owned weapon. Deterministic
// (the preset bytes are the engine's); the TCK's verifyDatagen task byte-compares the
// whole cooked tree against golden fixtures.
// ---------------------------------------------------------------------------
tasks.register('datagenContent', JavaExec) {
    group = 'vine'
    description = 'Cooks consumer source assets and combat partner presets into this cell\'s derived resources (sub-02 Stage E, sub-10).'
    // Everything the driver compiles against, deliberately WITHOUT this module's
    // resources dir: the loader driver's service entry lives there, and the cooking JVM
    // must bind the datagen driver only. The consumer's own output is on the classpath
    // because presets are cooked from what that consumer registered in the engine, not
    // from a second reading of its sources.
    classpath = files(
            sourceSets.datagen.output,
            sourceSets.main.output.classesDirs,
            configurations.runtimeClasspath,
            project(':vine-testmod').sourceSets.main.output)
    mainClass = 'dev.vineengine.vine.internal.driver1211.neoforge.datagen.NeoForge1211Datagen'
    def outDir = layout.buildDirectory.dir('datagen/1.21.1-neoforge').get().asFile
    args = [
            '--cell', '1.21.1-neoforge',
            '--assets', project(':vine-testmod').file('src/main/resources/assets').absolutePath,
            '--out', outDir.absolutePath,
    ]
    outputs.dir(outDir)
}
