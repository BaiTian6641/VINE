# sub-00 Stage D: CI matrix + per-cell boot smoke + Prime Invariant gate (§7).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Matrix compile: shared modules on both JDKs, drivers only on their
  # required JDK (§7). Toolchains (foojay) cover compile targets; setup-java
  # pins the daemon JVM.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { scope: shared, jdk: 21 }
          - { scope: shared, jdk: 25 }
          - { scope: driver-1.21.1-neoforge, jdk: 21 }
          - { scope: driver-1.21.1-fabric, jdk: 21 }
          - { scope: driver-26.x-neoforge, jdk: 25 }
          - { scope: driver-26.x-fabric, jdk: 25 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Build shared modules
        if: matrix.scope == 'shared'
        run: ./gradlew :vine-api:build :vine-client-api:build :vine-core:build :vine-spi:build :vine-tck:build :vine-testmod:build
      - name: Build driver cell
        if: matrix.scope != 'shared'
        run: ./gradlew ":drivers:${{ matrix.scope }}:build"

  # Per-cell headless server boot smoke: pass only on driver marker + Done,
  # under a timeout; the script stops the server afterwards.
  boot-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cell: 1.21.1-neoforge, jdk: 21 }
          - { cell: 1.21.1-fabric, jdk: 21 }
          - { cell: 26.x-neoforge, jdk: 25 }
          - { cell: 26.x-fabric, jdk: 25 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Headless boot smoke
        run: bash ci/boot-smoke.sh "${{ matrix.cell }}"
        env:
          BOOT_SMOKE_TIMEOUT: 900

  # Prime Invariant gate: API jars must not reference loader/MC packages (§5.1).
  prime-invariant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build API jars
        run: ./gradlew :vine-api:jar :vine-client-api:jar
      - name: Scan API jars for loader/MC references
        run: bash ci/prime-invariant.sh
