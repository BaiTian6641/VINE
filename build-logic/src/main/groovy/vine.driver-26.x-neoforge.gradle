import org.gradle.api.publish.maven.MavenPublication

// 26.x NeoForge cell (sub-00 Stage C): Java 25 bytecode (26.1+ requires it,
// §5.10); the game ships unobfuscated, so no mappings step — ModDevGradle only.
// MDG is applied by alias in the subproject (sub-00 §4).
plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'dev.vineengine'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(25)
    // Parameter names kept for descriptor/Codec introspection at runtime.
    options.compilerArgs += ['-parameters']
}

dependencies {
    implementation project(':vine-api')
    implementation project(':vine-core')
    implementation project(':vine-spi')
}

// Stage E: cell-stamped driver artifact, published to the local repo.
base {
    archivesName = 'vine-driver-26.x-neoforge'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'vine-driver-26.x-neoforge'
        }
    }
    repositories {
        maven {
            name = 'vineLocal'
            url = rootProject.layout.buildDirectory.dir('repo').get().asFile.toURI()
        }
    }
}
