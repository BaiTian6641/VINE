import org.gradle.api.publish.maven.MavenPublication

// 1.21.1 Fabric cell (sub-00 Stage B): Java 21 bytecode; Yarn + intermediary
// via remapping fabric-loom (applied by alias in the subproject — toolchain
// plugins never enter build-logic's classpath, sub-00 §4). Loom adds the
// Fabric/Mojang/Central repositories itself.
plugins {
    id 'java-library'
    id 'maven-publish'
}
group = 'dev.vineengine'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(21)
    // Parameter names kept for descriptor/Codec introspection at runtime.
    options.compilerArgs += ['-parameters']
}

dependencies {
    implementation project(':vine-api')
    implementation project(':vine-core')
    implementation project(':vine-spi')
}

// Stage E: cell-stamped driver artifact (loom publishes the remapped jar via
// the java component), local repo only.
base {
    archivesName = 'vine-driver-1.21.1-fabric'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'vine-driver-1.21.1-fabric'
        }
    }
    repositories {
        maven {
            name = 'vineLocal'
            url = rootProject.layout.buildDirectory.dir('repo').get().asFile.toURI()
        }
    }
}
